name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      # SUT(petclinic 사본)·외부 샘플 의존 테스트는 CI에서 skip된다 (로컬과 동일 규약)
      - run: python -m pytest tests/ -q
