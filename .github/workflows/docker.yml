name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "빌드할 릴리스 태그 (예: v0.1.1) — 백필/재빌드용"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest tests/ -q

  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test   # 테스트를 통과한 커밋만 이미지로 배포한다
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: imgtag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._+-][A-Za-z0-9._+-]*)?$ ]]; then
              echo "::error::'$INPUT_TAG'는 v<semver> 태그가 아니다."; exit 1
            fi
            echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER}/kn-estimator:${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER}/kn-estimator:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.imgtag.outputs.tag }}
